name: HNYDAQD Core Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  disable-onyx-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Disable Unneeded Workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Disabling Onyx default workflows..."
          WORKFLOWS=(
            "pr-golang-tests.yml"
            "cve-tracking.yml"
            "update-sandbox-browser.yml"
            "pr-python-tests.yml"
            "pr-playwright-tests.yml"
            "pr-python-connector-tests.yml"
            "pr-python-checks.yml"
            "pr-database-tests.yml"
            "pr-external-dependency-unit-tests.yml"
            "quality-checks.yml"
            "pr-quality-checks.yml"
            "cve-alerts.yml"
            "cve-alerts-nightly.yml"
            "golang.yml"
            "main-hnydaqd.yml"
          )
          for wf in "${WORKFLOWS[@]}"; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/disable" || true
          done

  test-hnydaqd:
    runs-on: ubuntu-latest
    needs: disable-onyx-workflows
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic cryptography

      - name: Run tests
        working-directory: ./backend
        run: |
          if [ -d hnydaqd/tests ]; then
            pytest hnydaqd/tests -v
          else
            echo "No tests found."
          fi
