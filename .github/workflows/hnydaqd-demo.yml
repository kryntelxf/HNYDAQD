name: HNYDAQD E2E Demo

on:
  push:
    branches:
      - main
    paths:
      - "backend/hnydaqd/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/hnydaqd/requirements.txt
          python -m pip install pytest pydantic

      - name: Run E2E demo
        working-directory: ./backend
        run: |
          python -m hnydaqd.demo.e2e_demo | tee "${RUNNER_TEMP}/demo-output.txt"

      - name: Upload demo output as evidence
        uses: actions/upload-artifact@v4
        with:
          name: hnydaqd-e2e-demo-output
          path: ${{ runner.temp }}/demo-output.txt
          retention-days: 90
