name: Final HNYDAQD Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install cryptography and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography pytest pydantic
          python -c "import cryptography; print('OK:', cryptography.__version__)"

      - name: Run tests
        run: |
          PYTHONPATH=backend python -m pytest -c /dev/null -v backend/hnydaqd/tests
