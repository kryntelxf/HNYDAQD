name: Final HNYDAQD Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install cryptography and dependencies
        run: |
          python -m pip install --upgrade pip
          # KUNCI PERBAIKAN: Gunakan --user agar terinstal di site-packages user
          python -m pip install --user cryptography pytest pydantic
          python -c "import cryptography; print('OK:', cryptography.__version__)"

      - name: Run tests
        run: |
          # KUNCI PERBAIKAN: Tambahkan site-packages user ke PYTHONPATH
          # agar pytest bisa menemukan cryptography
          export PYTHONPATH=$PYTHONPATH:$(python -m site --user-site):backend
          python -m pytest -c /dev/null -v backend/hnydaqd/tests
