name: HNYDAQD Main CI & Cleaner

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  disable-onyx-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Disable Unneeded Workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Disabling Onyx default workflows..."
          WORKFLOWS=(
            "pr-golang-tests.yml"
            "cve-tracking.yml"
            "update-sandbox-browser.yml"
            "pr-python-tests.yml"
            "pr-playwright-tests.yml"
            "pr-python-connector-tests.yml"
            "pr-python-checks.yml"
            "pr-database-tests.yml"
            "pr-external-dependency-unit-tests.yml"
            "quality-checks.yml"
            "pr-quality-checks.yml"
            "cve-alerts.yml"
            "cve-alerts-nightly.yml"
            "golang.yml"
          )
          for wf in "${WORKFLOWS[@]}"; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/disable" || true
          done

  hnydaqd-checks:
    runs-on: ubuntu-latest
    needs: disable-onyx-workflows
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies (WAJIB: cryptography dan pytest)
        run: |
          python -m pip install --upgrade pip
          # Instal cryptography SEBELUM pytest agar filter Onyx tidak crash
          pip install cryptography pytest pydantic

      - name: Verify Cryptography Installed
        run: |
          python -c "import cryptography; print('Cryptography OK:', cryptography.__version__)"

      - name: Run HNYDAQD Tests
        working-directory: ./backend
        run: |
          # Jalankan pytest dengan mengabaikan pytest.ini Onyx (-c /dev/null)
          # dan set PYTHONPATH ke root backend agar import hnydaqd berhasil
          PYTHONPATH=. pytest -c /dev/null -v hnydaqd/tests
