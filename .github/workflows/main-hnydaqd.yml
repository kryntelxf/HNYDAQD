name: HNYDAQD Main CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  hnydaqd-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic

      - name: Run HNYDAQD synthetic tests
        run: |
          # Jika folder test belum ada, lewati saja agar CI tidak error
          if [ -d backend/hnydaqd/tests ]; then
            pytest backend/hnydaqd/tests -v
          else
            echo "Belum ada test HNYDAQD. Skipping..."
          fi
