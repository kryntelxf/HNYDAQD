name: HNYDAQD Main CI & Cleaner

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  disable-onyx-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Disable Unneeded Workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOWS=(
            "pr-golang-tests.yml" "cve-tracking.yml" "update-sandbox-browser.yml"
            "pr-python-tests.yml" "pr-playwright-tests.yml" "pr-python-connector-tests.yml"
            "pr-python-checks.yml" "pr-database-tests.yml" "pr-external-dependency-unit-tests.yml"
            "quality-checks.yml" "pr-quality-checks.yml" "cve-alerts.yml" "cve-alerts-nightly.yml"
            "golang.yml" "hnydaqd-tests-v2.yml"
          )
          for wf in "${WORKFLOWS[@]}"; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/disable" || true
          done

  hnydaqd-checks:
    runs-on: ubuntu-latest
    needs: disable-onyx-workflows
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # KUNCI PERBAIKAN: Install langsung ke Python global runner
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography pytest pydantic
          python -c "import cryptography; print('Cryptography OK:', cryptography.__version__)"

      # KUNCI PERBAIKAN: Jalankan dari root dengan bypass pytest.ini Onyx
      - name: Run Tests
        run: |
          PYTHONPATH=backend python -m pytest -c /dev/null -v backend/hnydaqd/tests
