name: HNYDAQD Main CI & Cleaner

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disable-onyx-workflows:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Disable Unneeded Workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Disabling Onyx default workflows..."
          WORKFLOWS=(
            "pr-golang-tests.yml"
            "cve-tracking.yml"
            "update-sandbox-browser.yml"
            "pr-python-tests.yml"
            "pr-playwright-tests.yml"
            "pr-python-connector-tests.yml"
            "pr-python-checks.yml"
            "pr-database-tests.yml"
            "pr-external-dependency-unit-tests.yml"
            "quality-checks.yml"
            "pr-quality-checks.yml"
          )
          for wf in "${WORKFLOWS[@]}"; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/disable" || true
          done

  hnydaqd-checks:
    runs-on: ubuntu-latest
    needs: disable-onyx-workflows
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic cryptography

      - name: Run HNYDAQD synthetic tests
        working-directory: ./backend
        run: |
          if [ -d hnydaqd/tests ]; then
            pytest hnydaqd/tests -v
          else
            echo "No HNYDAQD tests yet."
          fi
