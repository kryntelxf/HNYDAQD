name: HNYDAQD Main CI & Cleaner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # JOB 1: Mematikan workflow Onyx yang mengganggu
  disable-onyx-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Disable Golang Workflow
        run: |
          echo "Menonaktifkan workflow Golang bawaan Onyx..."
          curl -X PUT -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/kryntelxf/HNYDAQD/actions/workflows/golang.yml/disable || true

  # JOB 2: Menjalankan test keamanan kita (HNYDAQD)
  hnydaqd-checks:
    runs-on: ubuntu-latest
    needs: disable-onyx-workflows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic

      - name: Run HNYDAQD synthetic tests
        working-directory: ./backend
        run: |
          if [ -d hnydaqd/tests ]; then
            pytest hnydaqd/tests -v
          else
            echo "Belum ada test HNYDAQD. Skipping..."
          fi
