name: HNYDAQD Main CI & Cleaner

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  disable-onyx-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Disable Unneeded Workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Disabling Onyx default workflows..."
          WORKFLOWS=(
            "pr-golang-tests.yml" "cve-tracking.yml" "update-sandbox-browser.yml"
            "pr-python-tests.yml" "pr-playwright-tests.yml" "pr-python-connector-tests.yml"
            "pr-python-checks.yml" "pr-database-tests.yml" "pr-external-dependency-unit-tests.yml"
            "quality-checks.yml" "pr-quality-checks.yml" "cve-alerts.yml" "cve-alerts-nightly.yml"
            "golang.yml"
          )
          for wf in "${WORKFLOWS[@]}"; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/disable" || true
          done

  hnydaqd-checks:
    runs-on: ubuntu-latest
    needs: disable-onyx-workflows
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # KUNCI PERBAIKAN: Gunakan Virtual Environment agar pip & pytest sinkron
      - name: Create Virtual Environment & Install Deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install cryptography pytest pydantic
          echo "Cryptography version:"
          python -c "import cryptography; print(cryptography.__version__)"

      - name: Run HNYDAQD Tests (Isolated Config)
        working-directory: ./backend/hnydaqd
        run: |
          # Aktifkan venv di dalam folder test
          source ../../.venv/bin/activate
          # Jalankan test
          pytest -v tests
