name: Golang Tests (Disabled)

concurrency:
  group: Golang-Tests-${{ github.workflow }}-${{ github.head_ref || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch: # HANYA BISA DIJALANKAN MANUAL, TIDAK OTOMATIS

permissions:
  contents: read

env:
  GO_VERSION: "1.27.4"

jobs:
  detect-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: set-modules
        run: echo "modules=$(find . -name 'go.mod' -exec dirname {} \; | jq -Rc '[.,inputs]')" >> "$GITHUB_OUTPUT"

  golang:
    needs: detect-modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        modules: ${{ fromJSON(needs.detect-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - run: go mod tidy
        working-directory: ${{ matrix.modules }}
      - run: git diff --exit-code go.mod go.sum
        working-directory: ${{ matrix.modules }}

      - name: Build ods
        run: go build -o "${RUNNER_TEMP}/ods" .
        working-directory: tools/ods

      - name: Test (No AWS)
        env:
          MODULE: ${{ matrix.modules }}
        run: |
          "${RUNNER_TEMP}/ods" coverage "${MODULE}" --check \
            --profile "${RUNNER_TEMP}/coverage/coverage.out"
