name: HNYDAQD CI

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  hnydaqd-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install minimal deps for HNY tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pydantic

      - name: Run HNYDAQD synthetic tests
        run: |
          if [ -d backend/hnydaqd/tests ]; then
            pytest backend/hnydaqd/tests -v
          else
            echo "No HNYDAQD tests yet — skipping."
          fi
