name: HNYDAQD CI

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
  workflow_dispatch:

jobs:
  hnydaqd-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic

      - name: Run HNYDAQD tests if present
        run: |
          if [ -d backend/hnydaqd/tests ]; then
            pytest backend/hnydaqd/tests -v
          else
            echo "No HNYDAQD tests yet."
          fi
