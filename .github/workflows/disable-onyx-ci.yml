name: Disable Onyx Default CI

on:
  push:
    branches: [ main ]

jobs:
  disable-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Disable problematic workflows
        run: |
          echo "Menonaktifkan workflow Golang Onyx via GitHub API..."
          # Ini akan menonaktifkan semua workflow yang mengandung nama 'Golang'
          # Tanpa perlu menghapus file aslinya.
          curl -X PUT -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/kryntelxf/HNYDAQD/actions/workflows/golang.yml/disable || true
          
          echo "Selesai."
